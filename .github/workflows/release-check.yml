name: Release check

on:
  pull_request:
  push:
    branches: [web3curtis/critiqor]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and runtime dependencies
        run: |
          python -m pip install --upgrade build
          python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Build release archives
        run: python -m build
      - name: Verify release contents and privacy
        run: |
          python scripts/verify_release_artifacts.py dist/*.whl dist/*.tar.gz
          python scripts/audit_release_artifacts.py dist/*.whl dist/*.tar.gz

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critiqor"
version = "0.2.19"
description = "Runtime intelligence CLI for reviewing AI agent reliability."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Critiqor Contributors" }]
license = "MIT"
keywords = ["ai", "agents", "openclaw", "observability", "reliability", "diagnosis"]
dependencies = ["click>=8.1", "cryptography>=43", "websocket-client>=1.8"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
include = ["critiqor*"]
exclude = ["critiqor.core_engine_dashboard*"]

[tool.setuptools.package-data]
critiqor = [
    "clawhub/critiqor-openclaw/*.js",
    "clawhub/critiqor-openclaw/*.json",
    "core_engine_dashboard/package.json",
    "core_engine_dashboard/.output/**/*",
]

[project.scripts]
critiqor = "critiqor.cli:main"

[tool.setuptools.exclude-package-data]
"*" = ["private_backend/*", "runs/*", "tests/*"]
